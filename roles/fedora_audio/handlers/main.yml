---
# handlers file for fedora_audio

- name: Restart alsa mixer restore
  become: true
  ansible.builtin.systemd:
    name: "{{ fedora_audio_unit_name }}"
    state: restarted
    daemon_reload: true

- name: Restart easyeffects preset
  ansible.builtin.systemd:
    name: "{{ fedora_audio_easyeffects_unit }}"
    state: restarted
    scope: user
    daemon_reload: true
