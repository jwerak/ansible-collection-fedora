---
# These are dynamic includes, so they need their own tags: tags on the tasks
# they pull in are not visible until the include has already been evaluated.
- name: Import ALSA mixer control tasks
  ansible.builtin.include_tasks:
    file: alsa.yml
  tags:
    - audio

- name: Import EasyEffects tasks
  ansible.builtin.include_tasks:
    file: easyeffects.yml
  when: fedora_audio_easyeffects_enabled | bool
  tags:
    - audio
